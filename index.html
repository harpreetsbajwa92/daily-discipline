<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transform">
<meta name="application-name" content="Transform">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Transformation tracker: check-in, WHOOP numbers, food log, habits, trends">
<title>Transformation</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0a0a0b;--bg2:#111113;--card:#17171a;--card2:#1f1f23;--line:#2a2a2f;
  --text:#fafafa;--muted:#b8b8c0;--dim:#8c8c96;
  --green:#22c55e;--green-bg:rgba(34,197,94,.14);--gold:#eab308;--gold-bg:rgba(234,179,8,.14);
  --red:#ef4444;--red-bg:rgba(239,68,68,.14);--blue:#38bdf8;--purple:#a78bfa;--orange:#fb923c;
  --r:18px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --tab-h:62px;--pad:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--text);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{max-width:560px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 8px) var(--pad) 8px;background:rgba(10,10,11,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05)}
.toprow{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:13px;color:var(--dim)}
.iconbtn{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:13px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:active{background:var(--card2)}
.iconbtn:disabled{opacity:.25}
.daynav{display:flex;align-items:center;gap:8px;margin-top:8px}
.daynav .dlabel{flex:1;height:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:16px}
.daynav .dlabel small{color:var(--gold);font-weight:600;margin-left:6px}
main{padding:12px var(--pad) calc(var(--tab-h) + var(--sab) + 24px)}
.panel{display:none}.panel.active{display:block;animation:rise .2s ease}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:750;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.hint{font-size:13px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select{margin-top:4px}
.in{width:100%;height:46px;padding:0 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:17px;font-weight:650;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--green)}
.in::placeholder{color:#55555e;font-weight:500}
.scale{margin-top:10px}
.scale .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
.scale .lbl b{color:var(--text)}
.chips10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.chips10 button{height:38px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--muted)}
.chips10 button.on{background:var(--green);border-color:var(--green);color:#04210f}
.habit{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:8px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:left}
.habit .ic{font-size:22px;width:30px;text-align:center}
.habit .t{flex:1}.habit .t b{display:block;font-size:16px}.habit .t small{color:var(--dim);font-size:13px}
.habit .ck{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.habit.on{border-color:rgba(34,197,94,.5);background:var(--green-bg)}
.habit.on .ck{background:var(--green);border-color:var(--green)}
.habit.on .ck::after{content:"";width:10px;height:16px;border:solid #04210f;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.habit.off .ck{border-color:rgba(239,68,68,.5)}
.auto{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-bg);padding:1px 6px;border-radius:6px;margin-left:6px}
.btn{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:14px;font-size:16px;font-weight:700}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(145deg,#22c55e,#16a34a);color:#04210f}
.btn-sec{background:var(--card2);border:1px solid var(--line)}
.btn-gold{background:linear-gradient(145deg,#eab308,#ca8a04);color:#2a1a02}
.btn-danger{background:var(--red-bg);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.btn-sm{min-height:38px;padding:6px 10px;font-size:14px;border-radius:11px;width:auto}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
.bar{margin-bottom:10px}
.bar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .top b{font-weight:750}.bar .top span{color:var(--muted)}
.bar .trk{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;transition:width .3s}
.bar.over .top span{color:#fca5a5}
.meal{margin-bottom:12px}
.mealhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mealhead b{font-size:16px;flex:1}
.mealhead small{color:var(--dim);font-size:13px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:6px;text-align:left}
.item .nm{flex:1;min-width:0}.item .nm b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small{color:var(--dim);font-size:12.5px}
.item .kc{font-weight:750;font-size:15px;white-space:nowrap}
.addrow{display:flex;gap:6px}
.addrow .btn{min-height:40px;font-size:14px;border-radius:11px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding-bottom:var(--sab);background:rgba(10,10,11,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar-in{width:100%;max-width:560px;display:flex;height:var(--tab-h)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:650;color:var(--dim)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--green)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px var(--pad) calc(var(--sab) + 18px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sheet h2 .sp{flex:1}
.flist{max-height:44dvh;overflow-y:auto;margin:8px 0;border-radius:12px}
.fopt{display:flex;width:100%;gap:8px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.fopt .nm{flex:1;min-width:0}.fopt .nm b{display:block;font-weight:650;font-size:15px}.fopt .nm small{color:var(--dim);font-size:12.5px}
.fopt .kc{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seg button{padding:7px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.qty{display:flex;align-items:center;gap:8px;margin:10px 0}
.qty .in{text-align:center;flex:1}
.qty button{width:50px;height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:700}
.macro4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
.macro4 div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.macro4 b{display:block;font-size:17px}.macro4 small{font-size:11.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 16px);transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:90;background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:650;font-size:15px;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{border-color:rgba(34,197,94,.5)}
.dhead,.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dhead span{text-align:center;font-size:12px;font-weight:700;color:var(--dim);padding-bottom:3px}
.dcell{min-height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:15px;font-weight:700;color:var(--muted);position:relative}
.dcell.blank{background:none;border:0}
.dcell.has{color:var(--text);border-color:#3a3a42}
.dcell .dots{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:2px}
.dcell .dots i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.dcell .dots i.k{background:var(--orange)}
.dcell .dots i.w{background:var(--blue)}
.dcell.today{box-shadow:inset 0 0 0 2px var(--text)}
.dcell.sel{box-shadow:inset 0 0 0 3px var(--gold)}
.dcell.full{background:rgba(34,197,94,.18)}
.dcell:disabled{opacity:.25}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calnav b{flex:1;text-align:center;font-size:17px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat3 div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat3 b{display:block;font-size:18px}.stat3 small{font-size:11.5px;color:var(--dim)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--dim);font-weight:650;font-size:12px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hgrid{display:grid;gap:3px}
.hgrid .hr{display:flex;align-items:center;gap:6px}
.hgrid .hr span{width:62px;font-size:12px;color:var(--muted);flex-shrink:0}
.hgrid .hr .cells{flex:1;display:grid;gap:2px}
.hgrid .hr .cells i{aspect-ratio:1;border-radius:3px;background:var(--bg);border:1px solid var(--line)}
.hgrid .hr .cells i.y{background:var(--green);border-color:var(--green)}
.hgrid .hr .cells i.n{background:rgba(239,68,68,.25);border-color:rgba(239,68,68,.35)}
.hday{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:6px;text-align:left}
.hday .d{width:74px;font-weight:700;font-size:14px}
.hday .s{flex:1;font-size:13px;color:var(--muted)}
.hday .sc{font-weight:800;font-size:14px}
.photo3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo3 button{min-height:70px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.photo3 button span{font-size:22px}
.photo3 button.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.big{font-size:28px;font-weight:850;letter-spacing:-.02em}
textarea.paste{width:100%;min-height:160px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-family:ui-monospace,Menlo,monospace}
.banner{background:linear-gradient(135deg,rgba(234,179,8,.16),rgba(34,197,94,.1));border:1px solid rgba(234,179,8,.35);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:14px}
.empty{color:var(--dim);font-size:14px;padding:8px 2px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.mb8{margin-bottom:8px}.mt8{margin-top:8px}.mt12{margin-top:12px}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="toprow">
    <div class="brand"><b>Transformation</b><small id="progLabel"></small></div>
    <button class="iconbtn" id="btnSend" aria-label="Send to Fitness"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button>
    <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="daynav" id="dayNav">
    <button class="iconbtn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="dlabel" id="dayLabel"></button>
    <button class="iconbtn" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
</header>
<main>
  <!-- TODAY -->
  <section class="panel active" id="p-today">
    <div id="banner"></div>
    <div class="card" id="miniTotals"></div>
    <div class="card">
      <h3>☀️ Morning check-in</h3>
      <div class="grid2">
        <label class="f">Weight (kg)<input class="in" id="ci-weight" type="number" inputmode="decimal" step="0.1" placeholder="70.0"></label>
        <label class="f">Sleep (hours)<input class="in" id="ci-sleep" type="number" inputmode="decimal" step="0.25" placeholder="optional"></label>
      </div>
      <div id="scales"></div>
    </div>
    <div class="card">
      <h3>⌚ WHOOP <span class="sp"></span><span class="hint" id="whoopSrc">manual entry</span></h3>
      <div class="grid2">
        <label class="f">Calories burned<input class="in" id="wh-calories" type="number" inputmode="numeric" placeholder="kcal"></label>
        <label class="f">Steps<input class="in" id="wh-steps" type="number" inputmode="numeric" placeholder="steps"></label>
        <label class="f">Strain (0–21)<input class="in" id="wh-strain" type="number" inputmode="decimal" step="0.1" placeholder="0.0"></label>
        <label class="f">Recovery %<input class="in" id="wh-recovery" type="number" inputmode="numeric" placeholder="%"></label>
      </div>
    </div>
    <div class="card">
      <h3>✅ Habits <span class="sp"></span><span class="hint" id="habitScore"></span></h3>
      <div id="habitList"></div>
      <p class="hint">Steps and protein tick themselves (<span class="auto" style="margin:0">auto</span>) from your numbers. Tap to override.</p>
    </div>
    <button class="btn btn-primary" id="btnSend2">📤 Send to Fitness</button>
  </section>

  <!-- FOOD -->
  <section class="panel" id="p-food">
    <div class="card" id="totals"></div>
    <div class="row mb8">
      <button class="btn btn-sec btn-sm" id="btnCopyY">↺ Copy yesterday</button>
      <button class="btn btn-sec btn-sm" id="btnTpl">★ Templates</button>
      <button class="btn btn-sec btn-sm" id="btnCustom">＋ Custom</button>
    </div>
    <div id="meals"></div>
    <button class="btn btn-primary mt8" id="btnSend3">📤 Send to Fitness</button>
  </section>

  <!-- WEEK -->
  <section class="panel" id="p-week">
    <div id="weekBox"></div>
  </section>

  <!-- TRENDS -->
  <section class="panel" id="p-trends">
    <div class="seg" id="rangeSeg"></div>
    <div id="trendBox"></div>
  </section>

  <!-- HISTORY -->
  <section class="panel" id="p-history">
    <div class="card"><div id="histCal"></div></div>
    <div class="card"><h3>Logged days</h3><div id="histList"></div></div>
  </section>
</main>
</div>

<nav class="tabbar"><div class="tabbar-in">
  <button class="tab active" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button class="tab" data-tab="food"><svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>Food</button>
  <button class="tab" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 7v4M11 7v3M15 7v4M19 7v3"/></svg>Week</button>
  <button class="tab" data-tab="trends"><svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>Trends</button>
  <button class="tab" data-tab="history"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>History</button>
</div></nav>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'transformation-tracker';
  var SCHEMA_VERSION = 1;
  var DEFAULT_START = '2026-10-31';
  var MEALS = [
    { id: 'breakfast', name: 'Breakfast' }, { id: 'pregym', name: 'Pre-gym' }, { id: 'postgym', name: 'Post-gym' },

  // ---------- TRENDS ----------
  function rangeKeys(n) {
    var end = todayKey(), first = loggedKeys()[0] || end, start = shiftKey(end, -(n - 1));
    if (n === 0) start = first < data.settings.startDate ? first : data.settings.startDate;
    if (start >= end) start = shiftKey(end, -13);
    var ks = []; for (var k = start; k <= end; k = shiftKey(k, 1)) ks.push(k);
    return ks;
  }
  function lineChart(keys, series, opts) {
    opts = opts || {};
    var W = 340, H = opts.h || 170, L = 36, R = 8, T = 10, B = 22, n = keys.length;
    var vals = []; series.forEach(function (s) { (s.vals || []).forEach(function (v) { if (v != null) vals.push(v); }); });
    if (!vals.length) return '<div class="empty">No data yet for this range.</div>';
    if (opts.extra) opts.extra.forEach(function (v) { if (v != null) vals.push(v); });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), span = opts.minSpan || 1;
    if (opts.zero) mn = 0;
    if (mx - mn < span) { var mid = (mx + mn) / 2; mn = opts.zero ? 0 : mid - span / 2; mx = opts.zero ? span : mid + span / 2; }
    var pv = (mx - mn) * 0.08; mx += pv; if (!opts.zero) mn -= pv;
    var x = function (i) { return L + (n <= 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - (v - mn) / (mx - mn)); };
    var g = '';
    for (var t = 0; t <= 3; t++) { var v = mn + (mx - mn) * t / 3, yy = y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="#2a2a2f" stroke-width="1"/><text x="' + (L - 4) + '" y="' + (yy + 3).toFixed(1) + '" text-anchor="end">' + (mx - mn >= 30 ? fmtInt(v) : r1(v)) + '</text>'; }
    [0, Math.floor((n - 1) / 2), n - 1].filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (i) {
      g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' + fmtMD(keys[i]) + '</text>';
    });
    series.forEach(function (s) {
      if (s.flat != null) { g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(s.flat).toFixed(1) + '" y2="' + y(s.flat).toFixed(1) + '" stroke="' + s.color + '" stroke-dasharray="4 4" stroke-width="1.5"/>'; return; }

    Object.keys(inc.weeks).forEach(function (k) { if (!data.weeks[k]) data.weeks[k] = inc.weeks[k]; else if (inc.weeks[k].waist != null && data.weeks[k].waist == null) data.weeks[k].waist = inc.weeks[k].waist; });
    var ids = {}; data.foods.forEach(function (f) { ids[f.id] = 1; }); inc.foods.forEach(function (f) { if (!ids[f.id]) data.foods.push(f); });
    var tids = {}; data.templates.forEach(function (t) { tids[t.id] = 1; }); inc.templates.forEach(function (t) { if (!tids[t.id]) data.templates.push(t); });
  }
  function parseBackup(txt) {
    var obj; try { obj = JSON.parse(txt); } catch (e) { return null; }
    var inc = obj && obj.data ? obj.data : obj;
    if (!inc || typeof inc !== 'object' || !inc.days) return null;
    return migrate(inc);
  }
  function openBackup() {
    openSheet('<h2>Backup<span class="sp"></span><button class="btn btn-sec btn-sm" id="bX">Done</button></h2>' +
      '<div style="display:grid;gap:8px"><button class="btn btn-primary" id="bFile">⬇ Export backup file</button><button class="btn btn-sec" id="bCopy">Copy backup as text</button></div>' +
      '<h3 class="mt12" style="margin-bottom:6px">Import</h3><p class="hint mb8">Pick a backup file or paste backup text.</p><input type="file" id="bIn" accept=".json,application/json,text/plain" class="in" style="padding-top:10px"><textarea class="paste mt8" id="bTxt" placeholder="…or paste backup text here" style="min-height:90px"></textarea>' +
      '<div class="row mt8"><button class="btn btn-sec" id="bMerge">Merge</button><button class="btn btn-danger" id="bRep">Replace all</button></div><p class="hint mt8">Merge keeps this phone’s data and adds days from the backup (the newer edit wins).</p>', function () {
      $('bX').onclick = closeSheet;
      $('bFile').onclick = function () {
        var json = backupJSON(), name = 'transformation-backup-' + todayKey() + '.json';
        try {
          var file = new File([json], name, { type: 'application/json' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: name }).then(function () { markExported(); toast('Backup saved ✓', true); }).catch(function (e) { if (!e || e.name !== 'AbortError') dl(json, name); });
            return;
          }
        } catch (e) {}
        dl(json, name);
      };
      $('bCopy').onclick = function () { copyText(backupJSON(), 'Backup copied. Paste it into Notes or email it to yourself'); markExported(); };
      var doImport = function (mode) {
        var go = function (txt) {
          var inc = parseBackup(txt); if (!inc) return toast('That is not a valid backup');
          var n = Object.keys(inc.days).length;
          var apply = function () { mergeIn(inc, mode); save(); closeSheet(); renderAll(); toast('Imported ' + n + ' days', true); };
          if (mode === 'replace') confirmSheet('Replace everything?', 'This phone’s data will be overwritten by the backup (' + n + ' days).', 'Replace', apply, true); else apply();
        };
        var f = $('bIn').files && $('bIn').files[0];
        if (f) { var rd = new FileReader(); rd.onload = function () { go(String(rd.result)); }; rd.readAsText(f); }
        else if ($('bTxt').value.trim()) go($('bTxt').value.trim());
        else toast('Pick a file or paste backup text first');
      };
      $('bMerge').onclick = function () { doImport('merge'); };
      $('bRep').onclick = function () { doImport('replace'); };
    });
  }

  // ---------- render ----------
  function renderAll() {
    renderHeader();
    if (tab === 'today') renderToday();
    else if (tab === 'food') renderFood();
    else if (tab === 'week') renderWeek();
    else if (tab === 'trends') renderTrends();
    else if (tab === 'history') renderHistory();
  }
  var lastToday = todayKey();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var t = todayKey(); if (t !== lastToday) { if (sel === lastToday) sel = t; lastToday = t; weekSel = null; }
    renderAll();
  });

  // Small hook for automated tests / a future WHOOP sync script (no personal data).
  window.TT = {
    data: function () { return data; }, summary: buildSummary, setDay: setDay, showTab: showTab,
    addFood: function (meal, foodId, qty) { addItem(sel, meal, foodById(foodId), qty); renderAll(); },
    applyTemplate: function (id, meal) { applyTemplate(data.templates.filter(function (t) { return t.id === id; })[0], meal); },
    copyYesterday: copyYesterday,
    setWhoop: function (k, w) { var d = dayForWrite(k); Object.keys(w).forEach(function (x) { if (x in d.whoop) d.whoop[x] = w[x]; }); save(); renderAll(); },
    importJSON: function (txt, mode) { var inc = parseBackup(txt); if (!inc) return false; mergeIn(inc, mode || 'merge'); save(); renderAll(); return true; },
    exportJSON: backupJSON
  };
  renderAll();
})();
</script>
</body></html>
