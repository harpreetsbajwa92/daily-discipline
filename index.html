<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="application-name" content="Daily">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Daily Non-Negotiables checklist">
<title>Daily Non-Negotiables</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#111;color:#eee}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
.date{color:#9a9a9a;font-size:15px;margin-top:2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.today-btn{background:#1e88e5;color:#fff;border:0;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.top{background:#222;border-radius:16px;padding:14px 16px;margin:14px 0}
.row{display:flex;justify-content:space-between;align-items:baseline}
.score{font-size:30px;font-weight:800}
.streak{color:#bbb;font-size:15px}
.bar{height:10px;background:#333;border-radius:999px;overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;background:#1e88e5;border-radius:999px;transition:width .25s}
.fill.full{background:#2e7d32}
.perfect{display:none;margin-top:10px;color:#7bd17f;font-weight:700;font-size:15px}
.perfect.on{display:block}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#222;color:#eee;border:2px solid #222;border-radius:16px;padding:16px;min-height:76px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.card:active{transform:scale(.985)}
.card .chk{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:transparent}
.card .t{font-size:18px;font-weight:700}
.card .s{font-size:13px;color:#9a9a9a;margin-top:2px}
.card.done{background:#2e7d32;border-color:#2e7d32}
.card.done .chk{background:#fff;border-color:#fff;color:#2e7d32}
.card.done .s{color:#d7efd8}
h2{font-size:14px;color:#9a9a9a;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin:22px 0 8px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:#222;border:2px solid #222;border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#bbb;font:inherit;font-size:12px;cursor:pointer}
.day.sel{border-color:#1e88e5}
.day .mb{width:12px;height:34px;background:#333;border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.day .mb i{display:block;width:100%;background:#1e88e5}
.day .mb i.full{background:#2e7d32}
.day b{color:#eee;font-size:12px}
.note{margin-top:20px;background:#222;border-radius:14px;padding:12px 14px;font-size:14px;color:#aaa;border:2px solid #222}
.note.mon{border-color:#1e88e5;background:#14304a;color:#fff;font-weight:600}
.wk{background:#222;border-radius:16px;padding:14px 14px 10px;margin-top:18px}
.wk h3{font-size:20px;font-weight:800}
.wk .tip{font-size:13px;color:#9a9a9a;margin:4px 0 10px}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.chip{background:#333;color:#ccc;border:2px solid #333;border-radius:999px;padding:6px 0;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.chip.cur{border-color:#1e88e5}
.chip.on{background:#1e88e5;border-color:#1e88e5;color:#fff}
.wkname{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin:4px 2px 8px;font-size:16px}
.wkname span{font-size:13px;color:#9a9a9a;font-weight:600}
.preview{font-size:13px;color:#ffb74d;margin:0 2px 8px}
.ex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#2a2a2a;color:#eee;border:0;border-radius:12px;padding:12px;margin-bottom:6px;min-height:52px;font:inherit;cursor:pointer}
.ex .chk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:transparent}
.ex .n{flex:1;font-size:16px;font-weight:600}
.ex .r{font-size:14px;color:#9a9a9a;white-space:nowrap}
.ex.done{background:#2e7d32}
.ex.done .chk{background:#fff;border-color:#fff;color:#2e7d32}
.ex.done .r{color:#d7efd8}
.ex:disabled{cursor:default;opacity:.85}
.sub{font-size:12px;color:#9a9a9a;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:10px 2px 6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Daily Non-Negotiables</h1>
  <div class="date"><span id="date"></span><button class="today-btn" id="todayBtn" hidden>Back to today</button></div>

  <div class="top">
    <div class="row"><div class="score" id="score">0/8</div><div class="streak" id="streak"></div></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="perfect" id="perfect">Perfect day 💪</div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="wk" id="workout">
    <h3>Today's Workout</h3>
    <div class="tip">Leave 1-2 reps in the tank. Add a rep or a little weight every week.</div>
    <div class="chips" id="chips"></div>
    <div id="wkbody"></div>
  </div>

  <h2>Last 7 days</h2>
  <div class="strip" id="strip"></div>

  <div class="note" id="note">Monday: send Fitness your weight, scale report, WHOOP screenshots and 3 photos.</div>
</div>
<script>
(function(){
  var ITEMS=[
    ["~1,650 kcal, eat the diet chart","Palm of protein, 1 spoon oil, no roti at dinner"],
    ["150 g protein","Eggs + shake + yogurt bowl every day"],
    ["Zero sugar, zero alcohol","No sweets, juice, pop, desserts or drinks"],
    ["4 L water","Finish 2 L before lunch"],
    ["8,000+ steps","Walk after meals and on calls"],
    ["Train (5 days/week)","Push, Pull, Legs, Upper, Lower + abs 3x"],
    ["Supplements","Fish oil, CoQ10, multivitamin, 5 g creatine"],
    ["7+ hours sleep","In bed by 12, up by 8"]
  ];
  var N=ITEMS.length, PREFIX="nn-v1:";
  var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
  function load(k){try{var v=JSON.parse(localStorage.getItem(PREFIX+k));if(Array.isArray(v)&&v.length===N)return v.map(Boolean);}catch(e){}return new Array(N).fill(false);}
  function save(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v));}catch(e){}}
  function count(v){return v.filter(Boolean).length;}

  var ABS=[["Hanging leg raises","3x10-15"],["Cable crunch","3x12-15"],["Ab wheel or plank","3x45s"],["Cable woodchoppers","3x12/side"]];
  var WALK=["Incline walk","15-20 min"];
  // index = JS weekday (0=Sun)
  var PLAN=[
    {n:"Rest",x:[["Walk","easy"],["Progress photos","front, side, back"]]},
    {n:"Push",x:[["Incline DB press","4x8-10"],["Machine/flat bench press","3x8-10"],["Seated DB shoulder press","3x8-10"],["Lateral raises","4x12-15"],["Rope pushdown","3x12"],["Overhead triceps extension","3x12"],["Incline walk (10-12%, ~5 km/h)","15-20 min"]]},
    {n:"Pull + Abs",x:[["Lat pulldown / pull-ups","4x8-10"],["Chest-supported row","4x8-10"],["Seated cable row","3x10-12"],["Face pulls","3x15"],["DB curl","3x10-12"],["Hammer curl","3x12"]],abs:true},
    {n:"Legs",x:[["Squat / hack squat","4x6-8"],["Romanian deadlift","3x8-10"],["Leg press","3x10-12"],["Leg curl","3x12"],["Calf raises","4x15"],WALK]},
    {n:"Active rest",x:[["Steps","10k"],["Incline walk","30 min"]]},
    {n:"Upper + Abs",x:[["Incline press","3x8-10"],["Lat pulldown","3x10"],["Lateral raises","4x15"],["Rear delt fly","3x15"],["Superset curls + pushdowns","3x12"],WALK],abs:true},
    {n:"Lower + Abs",x:[["Bulgarian split squat","3x10/leg"],["Hip thrust","3x10"],["Leg extension","3x12"],["Leg curl","3x12"]],abs:true}
  ];
  function exList(dow){var p=PLAN[dow];return p.abs?p.x.concat(ABS):p.x;}
  function loadW(k,len){try{var v=JSON.parse(localStorage.getItem(PREFIX+"w:"+k));if(Array.isArray(v)&&v.length===len)return v.map(Boolean);}catch(e){}return new Array(len).fill(false);}
  function saveW(k,v){try{localStorage.setItem(PREFIX+"w:"+k,JSON.stringify(v));}catch(e){}}
  var planDow=null; // null = follow the viewed day
  var CHIP_ORDER=[1,2,3,4,5,6,0];

  var today=key(new Date()), view=today;
  var $=function(id){return document.getElementById(id);};

  function streak(){
    var d=parse(today), s=0;
    if(count(load(today))<N) d=addDays(d,-1); // today not finished yet: count up to yesterday
    while(count(load(key(d)))===N && s<3650){s++;d=addDays(d,-1);}
    return s;
  }

  function render(){
    var vd=parse(view), st=load(view), c=count(st), rest=(vd.getDay()===4||vd.getDay()===0);
    $("date").textContent=vd.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    $("todayBtn").hidden=(view===today);
    $("score").textContent=c+"/"+N;
    $("fill").style.width=(c/N*100)+"%";
    $("fill").className="fill"+(c===N?" full":"");
    $("perfect").className="perfect"+(c===N?" on":"");
    var s=streak();
    $("streak").textContent="🔥 "+s+" day streak";

    var html="";
    ITEMS.forEach(function(it,i){
      var t=it[0], sub=it[1];
      if(i===5&&rest){t="Rest day: walk";sub="Thu & Sun are rest days";}
      html+='<button class="card'+(st[i]?" done":"")+'" data-i="'+i+'" aria-pressed="'+st[i]+'"><span class="chk">✓</span><span><div class="t">'+t+'</div><div class="s">'+sub+'</div></span></button>';
    });
    $("cards").innerHTML=html;

    var sh="";
    for(var n=6;n>=0;n--){
      var d=addDays(parse(today),-n), k=key(d), sc=count(load(k));
      sh+='<button class="day'+(k===view?" sel":"")+'" data-k="'+k+'"><span>'+(n===0?"Today":DOW[d.getDay()])+'</span><span class="mb"><i class="'+(sc===N?"full":"")+'" style="height:'+(sc/N*100)+'%"></i></span><b>'+sc+'</b></button>';
    }
    $("strip").innerHTML=sh;
    renderWorkout();

    $("note").className="note"+(parse(today).getDay()===1?" mon":"");
  }

  function renderWorkout(){
    var vdow=parse(view).getDay(), pd=(planDow===null?vdow:planDow), own=(pd===vdow);
    var ch="";
    CHIP_ORDER.forEach(function(d){ch+='<button class="chip'+(d===pd?" on":"")+(d===vdow?" cur":"")+'" data-d="'+d+'">'+DOW[d]+'</button>';});
    $("chips").innerHTML=ch;
    var list=exList(pd), w=own?loadW(view,list.length):new Array(list.length).fill(false), p=PLAN[pd];
    var done=w.filter(Boolean).length;
    var h='<div class="wkname">'+DOW[pd]+' - '+p.n+(own?'<span>'+done+'/'+list.length+'</span>':'')+'</div>';
    if(!own)h+='<div class="preview">Previewing '+DOW[pd]+'\'s plan. Tap '+DOW[vdow]+' to tick off this day.</div>';
    list.forEach(function(e,i){
      if(p.abs&&i===p.x.length)h+='<div class="sub">Abs circuit</div>';
      h+='<button class="ex'+(w[i]?" done":"")+'" data-i="'+i+'"'+(own?'':' disabled')+'><span class="chk">✓</span><span class="n">'+e[0]+'</span><span class="r">'+e[1]+'</span></button>';
    });
    $("wkbody").innerHTML=h;
  }

  $("chips").addEventListener("click",function(e){
    var b=e.target.closest(".chip"); if(!b)return; var d=+b.dataset.d;
    planDow=(d===parse(view).getDay())?null:d; render();
  });
  $("wkbody").addEventListener("click",function(e){
    var b=e.target.closest(".ex"); if(!b||b.disabled)return;
    var list=exList(parse(view).getDay()), w=loadW(view,list.length), i=+b.dataset.i;
    var wasAll=w.every(Boolean); w[i]=!w[i]; saveW(view,w);
    if(!wasAll&&w.every(Boolean)){var st=load(view);st[5]=true;save(view,st);}
    render();
  });

  $("cards").addEventListener("click",function(e){
    var b=e.target.closest(".card"); if(!b)return;
    var st=load(view), i=+b.dataset.i; st[i]=!st[i]; save(view,st); render();
  });
  $("strip").addEventListener("click",function(e){
    var b=e.target.closest(".day"); if(!b)return; view=b.dataset.k; planDow=null; render();
  });
  $("todayBtn").addEventListener("click",function(){view=today;planDow=null;render();});

  function checkDay(){var t=key(new Date()); if(t!==today){var wasToday=(view===today); today=t; if(wasToday){view=t;planDow=null;} render();}}
  document.addEventListener("visibilitychange",function(){if(!document.hidden)checkDay();});
  window.addEventListener("focus",checkDay);
  setInterval(checkDay,60000);
  render();
})();
</script>
</body>
</html>
